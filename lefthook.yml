# Lefthook - Git hooks manager
# https://github.com/evilmartians/lefthook

pre-commit:
  parallel: true
  commands:
    # ===== Apps: Desktop =====
    lint-desktop:
      root: 'apps/desktop/'
      glob: 'apps/desktop/**/*.{ts,tsx,mts,js,mjs,cjs}'
      run: pnpm eslint --fix --cache {staged_files}
      stage_fixed: true

    format-desktop:
      root: 'apps/desktop/'
      glob: 'apps/desktop/**/*.{ts,tsx,mts,js,mjs,cjs,json,css}'
      run: pnpm prettier --write {staged_files}
      stage_fixed: true

    # ===== Packages: Extension API =====
    lint-extension-api:
      root: 'packages/extension-api/'
      glob: 'packages/extension-api/**/*.{ts,tsx,mts,js,mjs,cjs}'
      run: pnpm eslint --fix --cache {staged_files}
      stage_fixed: true

    format-extension-api:
      root: 'packages/extension-api/'
      glob: 'packages/extension-api/**/*.{ts,tsx,mts,js,mjs,cjs,json,css}'
      run: pnpm prettier --write {staged_files}
      stage_fixed: true

    # ===== Packages: Extension SDK =====
    lint-extension-sdk:
      root: 'packages/extension-sdk/'
      glob: 'packages/extension-sdk/**/*.{ts,tsx,mts,js,mjs,cjs}'
      run: pnpm eslint --fix --cache {staged_files}
      stage_fixed: true

    format-extension-sdk:
      root: 'packages/extension-sdk/'
      glob: 'packages/extension-sdk/**/*.{ts,tsx,mts,js,mjs,cjs,json,css}'
      run: pnpm prettier --write {staged_files}
      stage_fixed: true

    # ===== Packages: Extension CLI =====
    lint-extension-cli:
      root: 'packages/extension-cli/'
      glob: 'packages/extension-cli/**/*.{ts,tsx,mts,js,mjs,cjs}'
      run: pnpm eslint --fix --cache {staged_files}
      stage_fixed: true

    format-extension-cli:
      root: 'packages/extension-cli/'
      glob: 'packages/extension-cli/**/*.{ts,tsx,mts,js,mjs,cjs,json}'
      run: pnpm prettier --write {staged_files}
      stage_fixed: true

    # ===== Packages: Create Extension =====
    lint-create-extension:
      root: 'packages/create-kisaki-extension/'
      glob: 'packages/create-kisaki-extension/**/*.{ts,tsx,mts,js,mjs,cjs}'
      run: pnpm eslint --fix --cache {staged_files}
      stage_fixed: true

    format-create-extension:
      root: 'packages/create-kisaki-extension/'
      glob: 'packages/create-kisaki-extension/**/*.{ts,tsx,mts,js,mjs,cjs,json}'
      run: pnpm prettier --write {staged_files}
      stage_fixed: true

    # ===== Common / Root =====
    format-root:
      glob: '*.{json,yaml,yml,md}'
      run: pnpm prettier --write {staged_files}
      stage_fixed: true

pre-push:
  commands:
    typecheck:
      run: pnpm typecheck
