appId: me.kisaki
productName: Kisaki
directories:
  buildResources: build

# Allowlist packaging: ship only build outputs, runtime assets, and bundled
# resources. Production dependencies are collected from node_modules separately.
files:
  - out/**
  - drizzle/**
  - resources/**
  # Media tools are staged per platform-arch; ship only the target's directory.
  - '!resources/bin/**'
  - resources/bin/${platform}-${arch}/**
asarUnpack:
  - resources/**

# Runtime hardening applied at package time.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true

# Ship only the locales the app supports; Chromium falls back to en-US.
electronLanguages:
  - en-US
  - zh-CN
  - ja

# kisaki:// deeplinks; also generates CFBundleURLTypes on macOS.
protocols:
  - name: Kisaki
    schemes:
      - kisaki

win:
  executableName: kisaki
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  include: build/installer.nsh
  installerLanguages:
    - en_US
    - zh_CN
  artifactName: ${name}-${version}-setup.${ext}

mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSCameraUsageDescription: Application requests access to the device's camera.
    NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}

linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: ximu3 <ximu3@users.noreply.github.com>
  category: Utility
  mimeTypes:
    - x-scheme-handler/kisaki
appImage:
  artifactName: ${name}-${version}.${ext}

# Native modules are rebuilt by install-app-deps in postinstall instead.
npmRebuild: false
publish:
  provider: github
  owner: ximu3
  repo: kisaki
