packages:
  - 'apps/*'
  - 'extensions/*'
  - 'packages/*'
  - '!**/templates/**'

# Single version source for dependencies shared across workspace projects.
catalog:
  # TypeScript toolchain
  typescript: ~6.0.3
  '@types/node': ^24.13.2
  tsx: ^4.23.0
  tsdown: ^0.22.4
  rimraf: ^6.1.3
  jiti: ^2.7.0

  # Lint and format
  eslint: ^10.6.0
  '@eslint/js': ^10.0.1
  typescript-eslint: ^8.63.0
  eslint-config-prettier: ^10.1.8
  eslint-plugin-vue: ^10.9.2
  vue-eslint-parser: ^10.4.1
  prettier: ^3.9.5

  # Vue and bundling
  vue: ^3.5.39
  vue-tsc: ^3.3.7
  vite: ^8.1.4
  '@vitejs/plugin-vue': ^6.0.7
  tailwindcss: ^4.3.2
  '@tailwindcss/vite': ^4.3.2
  '@iconify/tailwind4': ^1.2.3

  # Shared UI runtime
  '@vueuse/core': ^14.3.0
  reka-ui: ^2.10.1
  clsx: ^2.1.1
  class-variance-authority: ^0.7.1
  tailwind-merge: ^3.6.0
  tw-animate-css: ^1.4.0

  # Shared node utilities
  semver: ^7.8.5
  '@types/semver': ^7.7.1
  cross-spawn: ^7.0.6
  '@types/cross-spawn': ^6.0.6
  chokidar: ^5.0.0
  commander: ^15.0.0
  fflate: ^0.8.3
  kolorist: ^1.8.0

# smartcrop-sharp declares an outdated sharp peer range; the desktop app
# provides the current sharp at runtime.
peerDependencyRules:
  allowedVersions:
    'smartcrop-sharp>sharp': '>=0.35.0'

allowBuilds:
  better-sqlite3: true
  electron-winstaller: true
  esbuild: true
  lefthook: true
  maplibre-gl: true
  sharp: true
  vue-demi: true

minimumReleaseAgeExclude:
  - '@ximu3/*'
  - '@kisaki3/*'
