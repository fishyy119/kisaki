changelog:
  exclude:
    labels:
      - skip-release-notes
  categories:
    - title: '✨ Features'
      labels:
        - feat
        - feature
        - enhancement
    - title: '🔧 Fixes'
      labels:
        - fix
        - bug
        - bugfix
    - title: '♻️ Refactors'
      labels:
        - refactor
        - cleanup
    - title: '📝 Docs'
      labels:
        - docs
        - documentation
    - title: '⚙️ Chores'
      labels:
        - chore
        - ci
        - build
    - title: '📦 Dependencies'
      labels:
        - dependencies
        - dependency
        - deps
    - title: '📚 Other Changes'
      labels:
        - '*'
