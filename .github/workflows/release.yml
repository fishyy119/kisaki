name: Release

on:
  push:
    branches: [main]

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '10.25.0'
  VITE_BANGUMI_API_ACCESS_TOKEN: ${{ secrets.VITE_BANGUMI_API_ACCESS_TOKEN }}
  VITE_YMGAL_API_CLIENT_ID: ${{ secrets.VITE_YMGAL_API_CLIENT_ID }}
  VITE_YMGAL_API_CLIENT_SECRET: ${{ secrets.VITE_YMGAL_API_CLIENT_SECRET }}
  VITE_IGDB_API_CLIENT_ID: ${{ secrets.VITE_IGDB_API_CLIENT_ID }}
  VITE_IGDB_API_CLIENT_SECRET: ${{ secrets.VITE_IGDB_API_CLIENT_SECRET }}

jobs:
  # =============================================================================
  # Detect: Parse commit message for release intent
  # =============================================================================
  detect:
    name: Detect Release
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.parse.outputs.should_release }}
      target: ${{ steps.parse.outputs.target }}
      version: ${{ steps.parse.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Parse commit message
        id: parse
        run: |
          # Get commit message
          COMMIT_MSG=$(git log -1 --pretty=%B)
          FIRST_LINE=$(echo "$COMMIT_MSG" | head -n 1)

          # Check for release pattern: release(target): vX.Y.Z
          # Targets: desktop, extension-tooling
          if [[ "$FIRST_LINE" =~ ^release\((desktop|extension-tooling)\):\ v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
            TARGET="${BASH_REMATCH[1]}"
            VERSION="${BASH_REMATCH[2]}"

            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "target=$TARGET" >> $GITHUB_OUTPUT
            echo "version=$VERSION" >> $GITHUB_OUTPUT

            # Validate desktop changelog files strictly
            if [[ "$TARGET" == "desktop" ]]; then
              CHANGELOG_DIR="changelog/desktop/v$VERSION"
              REQUIRED_LOCALES=("zh-Hans" "en" "ja")
              MISSING_FILES=()

              for locale in "${REQUIRED_LOCALES[@]}"; do
                file="$CHANGELOG_DIR/$locale.md"
                if [[ ! -f "$file" ]]; then
                  MISSING_FILES+=("$file")
                fi
              done

              if [[ ${#MISSING_FILES[@]} -gt 0 ]]; then
                echo "❌ Missing required changelog files for desktop release v$VERSION:"
                printf '  - %s\n' "${MISSING_FILES[@]}"
                exit 1
              fi

              echo "✅ Verified desktop changelog files for v$VERSION"
            fi

            echo "🚀 Detected release: $TARGET v$VERSION"
          else
            echo "should_release=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No release commit detected"
          fi

  # =============================================================================
  # Release Desktop: Build Electron application artifacts
  # =============================================================================
  release-desktop:
    name: Release Desktop
    needs: detect
    if: needs.detect.outputs.should_release == 'true' && needs.detect.outputs.target == 'desktop'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm build:win

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/latest.yml
          if-no-files-found: error

  # =============================================================================
  # Publish Desktop: Create GitHub Release after all builds complete
  # =============================================================================
  publish-desktop:
    name: Publish Desktop Release
    needs: [detect, release-desktop]
    if: needs.detect.outputs.should_release == 'true' && needs.detect.outputs.target == 'desktop'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true

      - name: Find previous desktop tag
        id: previous_tag
        shell: bash
        run: |
          PREVIOUS_TAG=$(git tag --list 'desktop-v*' --sort=-v:refname | head -n 1)
          echo "tag=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"

          if [ -n "$PREVIOUS_TAG" ]; then
            echo "Found previous desktop tag: $PREVIOUS_TAG"
          else
            echo "No previous desktop tag found"
          fi

      - name: Build release body
        shell: bash
        env:
          PREVIOUS_TAG: ${{ steps.previous_tag.outputs.tag }}
          RELEASE_VERSION: ${{ needs.detect.outputs.version }}
        run: |
          VERSION="$RELEASE_VERSION"
          TAG="desktop-v$VERSION"
          REPO_URL="https://github.com/${{ github.repository }}"
          CHANGELOG_BASE="$REPO_URL/blob/$TAG/changelog/desktop/v$VERSION"

          {
            echo "## Changelog"
            echo
            echo "- [简体中文]($CHANGELOG_BASE/zh-Hans.md)"
            echo "- [English]($CHANGELOG_BASE/en.md)"
            echo "- [日本語]($CHANGELOG_BASE/ja.md)"
            echo

            if [ -n "$PREVIOUS_TAG" ]; then
              printf '**Full Changelog**: [`%s...%s`](%s/compare/%s...%s)\n' \
                "$PREVIOUS_TAG" "$TAG" "$REPO_URL" "$PREVIOUS_TAG" "$TAG"
            else
              printf '**Full Changelog**: [`View commits for %s`](%s/commits/%s)\n' \
                "$TAG" "$REPO_URL" "$TAG"
            fi
          } > release-body.md

      - name: Create Git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "desktop-v${{ needs.detect.outputs.version }}"
          git push origin "desktop-v${{ needs.detect.outputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: desktop-v${{ needs.detect.outputs.version }}
          name: Kisaki v${{ needs.detect.outputs.version }}
          body_path: release-body.md
          files: artifacts/*
          draft: false
          prerelease: false

  # =============================================================================
  # Release Extension Tooling: Publish all extension packages as one versioned unit
  # =============================================================================
  release-extension-tooling:
    name: Release Extension Tooling
    needs: detect
    if: needs.detect.outputs.should_release == 'true' && needs.detect.outputs.target == 'extension-tooling'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify extension tooling version
        run: pnpm check:extension-tooling ${{ needs.detect.outputs.version }}

      - name: Build extension tooling
        run: pnpm build:extension-tooling

      - name: Publish extension tooling packages
        run: pnpm publish:extension-tooling
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create Git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "extension-tooling-v${{ needs.detect.outputs.version }}"
          git push origin "extension-tooling-v${{ needs.detect.outputs.version }}"
