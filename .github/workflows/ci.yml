name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '10.25.0'
  VITE_BANGUMI_API_ACCESS_TOKEN: ${{ secrets.VITE_BANGUMI_API_ACCESS_TOKEN }}
  VITE_YMGAL_API_CLIENT_ID: ${{ secrets.VITE_YMGAL_API_CLIENT_ID }}
  VITE_YMGAL_API_CLIENT_SECRET: ${{ secrets.VITE_YMGAL_API_CLIENT_SECRET }}
  VITE_IGDB_API_CLIENT_ID: ${{ secrets.VITE_IGDB_API_CLIENT_ID }}
  VITE_IGDB_API_CLIENT_SECRET: ${{ secrets.VITE_IGDB_API_CLIENT_SECRET }}

jobs:
  # =============================================================================
  # Check: Lint + Typecheck (fast feedback)
  # =============================================================================
  check:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

  # =============================================================================
  # Build Extension Tooling: extension-api -> extension-registry -> extension-sdk -> extension-cli -> create-kisaki-extension
  # =============================================================================
  build-extension-tooling:
    name: Build Extension Tooling Packages
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build extension tooling packages
        run: pnpm build:extension-tooling

      - name: Verify extension tooling outputs
        run: |
          test -f packages/extension-api/dist/index.mjs
          test -f packages/extension-api/dist/index.d.mts
          test -f packages/extension-registry/dist/index.mjs
          test -f packages/extension-registry/dist/node.mjs
          test -f packages/extension-registry/dist/index.d.mts
          test -f packages/extension-registry/dist/node.d.mts
          test -f packages/extension-sdk/dist/index.mjs
          test -f packages/extension-sdk/dist/index.d.mts
          test -f packages/extension-cli/dist/index.mjs
          test -f packages/create-kisaki-extension/dist/index.mjs
          echo "All extension tooling outputs verified"

  # =============================================================================
  # Build App: Main Electron application (Windows only for now)
  # =============================================================================
  build-app:
    name: Build App (Windows)
    runs-on: windows-latest
    needs: check
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm build:win

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: kisaki-windows
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/latest.yml
          if-no-files-found: error
